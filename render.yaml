services:
  - type: web
    name: sts-fintech-attendance
    env: python
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt && python -m backend.seed"
    startCommand: "gunicorn backend.app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: MANAGER_INVITE_CODE
        value: STS-2026-INVITE
